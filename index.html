<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/src/assets/puffy.png?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono</title>
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.ts"></script>
</head>

<body>
    <div class="page-header">Chrono</div>
    <div class="clocks-container">
        <div class="clock-section primary-clock">
            <div class="clock-label primary-time">Local</div>
            <div class="clock">
                <div class="hour"></div>
                <div class="min"></div>
                <div class="sec"></div>
            </div>
        </div>

        <div class="clock-section secondary-clock">
            <button type="button" class="clock-label secondary-time">UTC</button>
            <div class="clock">
                <div class="hour"></div>
                <div class="min"></div>
                <div class="sec"></div>
            </div>
        </div>
    </div>

    <div class="tz-picker">
        <div class="tz-picker-header">Select Timezone region:</div>
        <div class="tz-regions">
            <button type="button" data-region="Africa">Africa</button>
            <button type="button" data-region="America">America</button>
            <button type="button" data-region="Antarctica">Antarctica</button>
            <button type="button" data-region="Arctic">Arctic</button>
            <button type="button" data-region="Asia">Asia</button>
            <button type="button" data-region="Atlantic">Atlantic</button>
            <button type="button" data-region="Australia">Australia</button>
            <button type="button" data-region="UTC">UTC/GMT</button>
            <button type="button" data-region="Europe">Europe</button>
            <button type="button" data-region="Indian">Indian</button>
            <button type="button" data-region="Pacific">Pacific</button>
        </div>
        <div class="country-list">
            <div class="country-list-header">Select Timezone country:</div>
        </div>
        <div class="city-list"></div>
        <div class="tz-list"></div>
    </div>

</body>

</html>
