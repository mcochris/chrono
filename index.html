<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/puffy.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chrono</title>
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/main.ts"></script>
</head>

<body>
    <div class="page-header">Chrono</div>
    <div class="clocks-container">
        <div class="clock-section local-time">
            <div class="clock-label">Local</div>
            <div class="clock">
                <div class="hour"></div>
                <div class="min"></div>
                <div class="sec"></div>
            </div>
        </div>

        <div class="clock-section utc-time">
            <button class="clock-label calc-time">UTC</button>
            <div class="clock">
                <div class="hour"></div>
                <div class="min"></div>
                <div class="sec"></div>
            </div>
        </div>
    </div>

    <div class="tz-picker">
        <div class="tz-picker-header">Select Timezone by:</div>
        <div class="tz-picker-body">
            <input type="text" class="tz-search" placeholder="Search timezone..." />
            <div class="tz-list"></div>
        </div>
    </div>

</body>

</html>
