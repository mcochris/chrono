<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<link rel="icon" href="/src/assets/favicon.ico" sizes="32x32">
	<link rel="icon" type="image/png" href="/src/assets/puffy.png" sizes="32x32">
	<link rel="apple-touch-icon" href="/src/assets/apple-touch-icon.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Chrono</title>
	<link rel="stylesheet" href="/src/style.css">
	<script type="module" src="/src/main.ts"></script>
</head>

<body>
	<header>Chrono</header>

	<div id="clocks-container">
		<div class="clock-section" id="primary-clock">
			<div class="clock-label"><span id="primary-clock-tz"></span></div>
			<div class="clock">
				<div class="hour"></div>
				<div class="min"></div>
				<div class="sec"></div>
			</div>
		</div>

		<div class="clock-section" id="secondary-clock">
			<button type="button" class="clock-label" id="secondary-time">UTC</button>
			<div class="clock">
				<div class="hour"></div>
				<div class="min"></div>
				<div class="sec"></div>
			</div>
		</div>
	</div>

	<div id="clock-legend-container">
		<div class="clock-legend">
			<div id="primary-time-legend">Primary time</div>
			<div id="primary-date-legend">Primary date</div>
		</div>
		<div class="clock-legend">
			<div>Time difference:</div>
			<div id="time-diff">0 hours 00 minutes</div>
		</div>
		<div class="clock-legend">
			<div id="secondary-time-legend">Secondary time</div>
			<div id="secondary-date-legend">Secondary date</div>
		</div>
	</div>

	<dialog id="tz-picker">
		<div>
			<div id="region-list-header">Select region:</div>
			<div id="region-list-buttons">
				<button type="button" data-region="Africa">Africa</button>
				<button type="button" data-region="America">America</button>
				<button type="button" data-region="Antarctica">Antarctica</button>
				<button type="button" data-region="Arctic">Arctic</button>
				<button type="button" data-region="Asia">Asia</button>
				<button type="button" data-region="Atlantic">Atlantic</button>
				<button type="button" data-region="Australia">Australia</button>
				<button type="button" data-region="UTC">UTC/GMT</button>
				<button type="button" data-region="Europe">Europe</button>
				<button type="button" data-region="Indian">Indian</button>
				<button type="button" data-region="Pacific">Pacific</button>
			</div>
		</div>

		<div id="country-list">
			<div id="country-list-header">Select country:</div>
			<div id="country-list-buttons"></div>
		</div>

		<div id="tz-list">
			<div id="tz-list-header">Select timezone:</div>
			<div id="tz-list-buttons"></div>
		</div>

		<div>
			<button type="button" id="tz-picker-exit-button">Exit</button>
			<button type="button" id="tz-picker-done-button" class="disabled-button">Done</button>
		</div>
	</dialog>

	<footer>Made by <a href="https://github.com/mcochris/chrono">Chris Strawser</a></footer>
</body>

</html>
